; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
build_src_filter = +<apartado4/apartado4.cpp>
monitor_speed = 115200
lib_deps = 
	arduino-libraries/ArduinoBLE@^2.1.0
	arduino-libraries/Arduino_LSM9DS1@^1.1.1
	

[env:esp32dev]
platform = espressif32
board = esp32dev ; Placa ESP32 clásica (soporta Bluetooth Classic SPP)
framework = arduino
monitor_speed = 115200

;upload_port = COM7
;monitor_port = COM7

; Filtramos únicamente el archivo del apartado 5
build_src_filter = -<*> +<apartado5/apartado5.cpp>

lib_deps = 
    powerbroker2/ELMDuino@^3.4.1
    ; ¡NO pongas BluetoothSerial aquí! El framework ya la incluye automáticamente.
